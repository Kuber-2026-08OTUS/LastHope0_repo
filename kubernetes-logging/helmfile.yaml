repositories:
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: seaweedfs
    url: https://seaweedfs.github.io/seaweedfs/helm

releases:
  # ------------------------------------------------------------
  # SeaweedFS (all-in-one, S3 для Loki, только infra-ноды)
  # ------------------------------------------------------------
  - name: seaweedfs
    namespace: seaweedfs
    createNamespace: true
    chart: seaweedfs/seaweedfs
    values:
      - allInOne:
          enabled: true
          data:
            type: emptyDir
          s3:
            enabled: true
          # tolerations и nodeSelector для основного пода — строки
          nodeSelector: |
            node-role: infra
          tolerations: |
            - key: "node-role"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"

      # Бакет для Loki + планирование для hook-задания
      - s3:
          createBuckets:
            - name: loki
          createBucketsHook:
            nodeSelector: |
              node-role: infra
            tolerations: |
              - key: "node-role"
                operator: "Equal"
                value: "infra"
                effect: "NoSchedule"

  # ------------------------------------------------------------
  # Loki (монолитный режим, S3 = SeaweedFS, только infra-ноды)
  # ------------------------------------------------------------
  - name: loki
    namespace: logging
    createNamespace: true
    chart: grafana/loki
    version: 7.5.0
    needs: [seaweedfs/seaweedfs]
    values:
      - loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: s3
            bucketNames:
              chunks: loki
              ruler: loki
            s3:
              endpoint: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
              access_key_id: <ваш-access-key>
              secret_access_key: <ваш-secret-key>
              s3forcepathstyle: true
              insecure: true
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true

      - deploymentMode: SingleBinary
      - singleBinary:
          initContainers:
            - name: fix-permissions
              image: busybox:1.36
              command: ["sh", "-c", "chown -R 10001:10001 /var/loki"]
              securityContext:
                runAsUser: 0
                runAsNonRoot: false
              volumeMounts:
                - name: storage
                  mountPath: /var/loki
          persistence:
            enabled: true
            size: 10Gi
            storageClass: standard
          podSecurityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          enabled: true
          replicas: 1
          nodeSelector:
            node-role: infra
          tolerations:
            - key: "node-role"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"

      - backend: { replicas: 0 }
      - read: { replicas: 0 }
      - write: { replicas: 0 }
      - ingester: { replicas: 0 }
      - querier: { replicas: 0 }
      - queryFrontend: { replicas: 0 }
      - queryScheduler: { replicas: 0 }
      - distributor: { replicas: 0 }
      - compactor: { replicas: 0 }
      - indexGateway: { replicas: 0 }
      - ruler: { replicas: 0 }
      - gateway: { enabled: false }
      - minio: { enabled: false }

  # ------------------------------------------------------------
  # Promtail (DaemonSet на всех нодах, включая infra)
  # ------------------------------------------------------------
  - name: promtail
    namespace: logging
    chart: grafana/promtail
    version: 6.16.6
    needs: [logging/loki]
    values:
      - config:
          clients:
            - url: http://loki.logging.svc.cluster.local:3100/loki/api/v1/push
        tolerations:
          - key: "node-role"
            operator: "Equal"
            value: "infra"
            effect: "NoSchedule"

  # ------------------------------------------------------------
  # Grafana (только infra-ноды, Loki как datasource)
  # ------------------------------------------------------------
  - name: grafana
    namespace: logging
    chart: grafana/grafana
    version: 8.5.0
    needs: [logging/loki]
    values:
      - nodeSelector:
          node-role: infra
        tolerations:
          - key: "node-role"
            operator: "Equal"
            value: "infra"
            effect: "NoSchedule"

      - datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Loki
                type: loki
                url: http://loki.logging.svc.cluster.local:3100
                access: proxy
                isDefault: true
                editable: false