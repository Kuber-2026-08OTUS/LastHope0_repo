apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: homework
  labels:
    app: nginx
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
  spec:
    containers:
    - name: nginx
      image: nginx:alpine
      ports:
      - containerPort: 8000
      volumeMounts:
      - name: workdir
        mountPath: /homework
      command: ["/bin/sh", "-c"]
      args:
      - echo 'server { listen 8000; root /homework; }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
      lifecycle:
        preStop:
          exec:
            command: ["/bin/sh", "-c", "rm -f /homework/index.html"]
      startupProbe:
        httpGet:
          path: /
          port: 8000
        failureThreshold: 30
        periodSeconds: 2
      readinessProbe:
        exec:
          command:
          - cat
          - /homework/index.html
        initialDelaySeconds: 3
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 3
      initContainers:
    - name: install
      image: busybox
      command: ["wget", "-O", "/init/index.html", "http://info.cern.ch"]
      volumeMounts:
      - name: workdir
        mountPath: /init
    volumes:
    - name: workdir
      emptyDir: {}