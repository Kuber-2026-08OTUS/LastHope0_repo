apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: homework
  labels:
    app: nginx
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      
      serviceAccountName: monitoring
      nodeSelector:
        homework: "true"

      initContainers:
      - name: install
        image: busybox
        command:
        - sh
        - -c
        - |
          if [ -f /init/index.html ]; then
            echo "File index.html already exists, skipping download"
          else
            wget -O /init/index.html http://info.cern.ch
          fi
          test -s /init/index.html || exit 1
          chmod 644 /init/index.html
          if [ -f /init/metrics.html ]; then
            echo "File metrics.html already exists, skipping download"
          else
            wget --no-check-certificate \
                 --header="Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                 -O /init/metrics.html https://kubernetes.default.svc/metrics
          fi
          test -s /init/metrics.html || exit 1
          chmod 644 /init/metrics.html
        volumeMounts:
        - name: workdir
          mountPath: /init
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: workdir
          mountPath: /homework
        - name: config
          mountPath: /homework/conf
          readOnly: true
        command: ["/bin/sh", "-c"]
        args:
        - echo 'server { listen 8000; root /homework; }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
        startupProbe:
          httpGet:
            path: /
            port: 8000
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /index.html
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3

      volumes:
      - name: workdir
        persistentVolumeClaim:
          claimName: pvc-homework
      - name: config
        configMap:
          name: cm-homework