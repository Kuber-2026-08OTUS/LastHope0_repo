---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-http
  namespace: homework
spec:
  parentRefs:
    - name: traefik
      sectionName: http
      kind: Gateway

  hostnames:
    - homework.otus

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /homepage
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /index.html
            statusCode: 307
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx
          namespace: homework
          port: 80
