apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mysql-operator
  labels:
    app.kubernetes.io/name: mysql-operator
subjects:
  - kind: ServiceAccount
    name: mysql-operator
    namespace: mysql-operator-system
roleRef:
  kind: ClusterRole
  name: mysql-operator
  apiGroup: rbac.authorization.k8s.io