releases:
  - name: kafka
    chart: oci://registry-1.docker.io/bitnamicharts/kafka
    version: 26.5.0
    namespace: prod
    createNamespace: true
    wait: true
    timeout: 600
    values:
      - image:
          registry: docker.io
          repository: bitnamilegacy/kafka
          tag: 3.5.2-debian-12-r9
        controller:
          replicaCount: 5
        listeners:
          client:
            protocol: SASL_PLAINTEXT
          interbroker:
            protocol: SASL_PLAINTEXT



  - name: kafka
    chart: oci://registry-1.docker.io/bitnamicharts/kafka
    version: 26.5.0
    namespace: dev
    createNamespace: true
    wait: true
    timeout: 600
    values:
      - image:
          registry: docker.io
          repository: bitnamilegacy/kafka
          tag: 3.5.2-debian-12-r9
        controller:
          replicaCount: 1
        listeners:
          client:
            protocol: SASL_PLAINTEXT
          interbroker:
            protocol: SASL_PLAINTEXT